<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>零安装模式 · 局域网同步</title>
  <!--__BOOT__-->
  <link rel="stylesheet" href="/app.css" />
  <style>
    .lite-head { align-items: flex-start; flex-wrap: wrap; }
    .lite-title { display: flex; align-items: center; gap: 10px; }
    .lite-title h1 { font-size: 16px; }
    .badge {
      padding: 3px 9px;
      font-size: 11px;
      color: var(--info);
      background: var(--info-soft);
      border: 1px solid color-mix(in srgb, var(--info) 34%, transparent);
      border-radius: 999px;
    }
    .lite-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 16px; padding: 16px clamp(16px, 3vw, 32px) 40px; max-width: 1280px; margin: 0 auto; }
    .lite-grid .card { align-self: start; }
    .file-drop {
      display: grid;
      place-items: center;
      gap: 8px;
      padding: 28px 16px;
      text-align: center;
      color: var(--text-dim);
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .file-drop:hover { border-color: var(--accent); color: var(--text); }
    .file-drop input { display: none; }
    .dl-list { display: grid; gap: 4px; max-height: 320px; overflow: auto; }
    .dl-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
    .dl-item .path { font-family: var(--font-mono); word-break: break-all; }
    .dl-item a { color: var(--info); text-decoration: none; font-size: 12px; white-space: nowrap; }
    .dl-item a:hover { text-decoration: underline; }
    .hint-inline { font-size: 12px; color: var(--text-mute); }
    @media (max-width: 960px) { .lite-grid { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 640px) {
      .lite-head { padding: 12px 16px; }
      .lite-title h1 { font-size: 15px; }
      .lite-title { gap: 8px 10px; flex-wrap: wrap; }
      .badge { display: none; }
      .top-actions { width: 100%; justify-content: flex-end; }
      #prefixInput { flex: 1 1 100% !important; }
    }
  </style>
</head>
<body>
  <header class="topbar lite-head">
    <div class="lite-title">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-globe" /></svg></span>
      <div>
        <h1>局域网同步 · 零安装模式</h1>
        <p class="hint-inline" id="liteSub">只需要浏览器：推送本地文件夹，或把对方文件打包下载</p>
      </div>
      <span class="badge">不需要装 Node</span>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="/">本机控制台</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色/浅色"><svg class="icon" aria-hidden="true"><use href="#i-moon" /></svg></button>
    </div>
  </header>

  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M3.5 12h17" /><path d="M12 3.5c2.5 2.4 3.8 5.3 3.8 8.5s-1.3 6.1-3.8 8.5c-2.5-2.4-3.8-5.3-3.8-8.5S9.5 5.9 12 3.5z" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 19V5" /><path d="M6 11l6-6 6 6" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M6 13l6 6 6-6" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2c.7 0 1.3.3 1.8.8L12 7h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l4.5 4.5L20 6.5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l8.5 15H3.5z" /><path d="M12 10v4.5" /><path d="M12 17.2h.01" /></symbol>
      <symbol id="i-zip" viewBox="0 0 24 24"><path d="M6 3.5h12v17H6z" /><path d="M6 7h12" /><path d="M11 10h2M11 13h2M11 16h2" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7L11.6 6.7" /><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.2-1.2" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l10 6.5-10 6.5z" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 6.2" /><path d="M20 5v6h-6" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-devices" viewBox="0 0 24 24"><rect x="3" y="4" width="12" height="9" rx="1.5" /><path d="M7 17h4" /><path d="M9 13v4" /><rect x="16" y="9" width="5" height="11" rx="1.5" /></symbol>
    </defs>
  </svg>

  <main class="lite-grid">
    <div class="col">
      <section class="card">
        <div class="card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-link" /></svg>第 1 步 · 连接对方</h2>
        </div>
        <div class="card-body" id="connectBody"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg>第 2 步 · 推送文件夹</h2>
          <button class="btn small" id="pushBtn" type="button" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>开始推送
          </button>
        </div>
        <div class="card-body" id="pushBody"></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <div class="card-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>从对方下载</h2>
          <div class="head-actions">
            <button class="btn small" id="refreshBtn" type="button" disabled>
              <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>刷新
            </button>
          </div>
        </div>
        <div class="card-body" id="downloadBody"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2><svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>进度</h2></div>
        <div class="card-body" id="logBody"></div>
      </section>
    </div>
  </main>

  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <script type="module" src="/lite.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>局域网同步 · Communication</title>
  <!--__BOOT__-->
  <link rel="stylesheet" href="/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2322c55e'/%3E%3Cpath d='M6 12h12M12 6v12' stroke='%23052e16' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-13.7-5.3L4 8" /><path d="M4 4v4h4" /><path d="M4 13a8 8 0 0 0 13.7 5.3L20 16" /><path d="M20 20v-4h-4" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2c.7 0 1.3.3 1.8.8L12 7h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" /></symbol>
      <symbol id="i-devices" viewBox="0 0 24 24"><rect x="3" y="4" width="12" height="9" rx="1.5" /><path d="M7 17h4" /><path d="M9 13v4" /><rect x="16" y="9" width="5" height="11" rx="1.5" /></symbol>
      <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 8.5a15 15 0 0 1 19 0" /><path d="M5.5 12a10.5 10.5 0 0 1 13 0" /><path d="M8.7 15.6a6 6 0 0 1 6.6 0" /><path d="M12 19h.01" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 6.2" /><path d="M20 5v6h-6" /></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 7h7M4 7l2.5-2.5M4 7l2.5 2.5" /><path d="M20 17h-7M20 17l-2.5-2.5M20 17l-2.5 2.5" /><path d="M13 5v6M11 13v6" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 19V5" /><path d="M6 11l6-6 6 6" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M6 13l6 6 6-6" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M9.5 7V5h5v2" /><path d="M6.5 7l.9 12h9.2l.9-12" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l8.5 15H3.5z" /><path d="M12 10v4.5" /><path d="M12 17.2h.01" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l4.5 4.5L20 6.5" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7L11.6 6.7" /><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.2-1.2" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l10 6.5-10 6.5z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" /></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .9-1 1.6v.4" /><path d="M12 17.2h.01" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
      <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="6" rx="1.5" /><rect x="3" y="13" width="18" height="6" rx="1.5" /><path d="M7 8h.01M7 16h.01" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a1 1 0 0 1 1-1h9" /></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h7l5 5V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20z" /><path d="M13 3.5v5h5" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M3.5 12h17" /><path d="M12 3.5c2.5 2.4 3.8 5.3 3.8 8.5s-1.3 6.1-3.8 8.5c-2.5-2.4-3.8-5.3-3.8-8.5S9.5 5.9 12 3.5z" /></symbol>
      <symbol id="i-zip" viewBox="0 0 24 24"><path d="M6 3.5h12v17H6z" /><path d="M6 7h12" /><path d="M11 10h2M11 13h2M11 16h2" /></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-sync" /></svg></span>
      <div class="brand-text">
        <h1>局域网同步</h1>
        <p id="brandSub">共享几个文件夹，与局域网里的其他机器按文件夹同步</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill" id="nodePill" hidden></span>
      <button class="btn ghost" id="helpBtn" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-help" /></svg>使用说明
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色/浅色主题" title="切换主题">
        <svg class="icon" aria-hidden="true"><use href="#i-moon" /></svg>
      </button>
    </div>
  </header>

  <main class="layout" id="layout" hidden>
    <div class="col col-left">
      <section class="card" aria-labelledby="localTitle">
        <div class="card-head">
          <h2 id="localTitle"><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>我的文件夹</h2>
          <button class="btn small" id="pickFolderBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>添加
          </button>
        </div>
        <div class="card-body" id="localBody"></div>
      </section>

      <section class="card" aria-labelledby="peerTitle">
        <div class="card-head">
          <h2 id="peerTitle"><svg class="icon" aria-hidden="true"><use href="#i-devices" /></svg>对端设备</h2>
          <button class="btn small primary" id="addPeerBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>添加
          </button>
        </div>
        <div class="card-body" id="peerBody"></div>
      </section>

      <section class="card" aria-labelledby="selfTitle">
        <div class="card-head">
          <h2 id="selfTitle"><svg class="icon" aria-hidden="true"><use href="#i-wifi" /></svg>本机</h2>
        </div>
        <div class="card-body" id="selfBody"></div>
      </section>
    </div>

    <div class="col col-right">
      <section class="card grow" aria-labelledby="planTitle">
        <div class="card-head">
          <h2 id="planTitle"><svg class="icon" aria-hidden="true"><use href="#i-compare" /></svg>对比结果</h2>
          <div class="head-actions" id="planActions" hidden>
            <label class="check subtle"><input type="checkbox" id="onlyDiff" checked /><span>只看差异</span></label>
            <button class="btn small" id="rescanBtn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>重新对比
            </button>
          </div>
        </div>
        <div class="card-body scroll" id="planBody"></div>
        <div class="exec-bar" id="execBar" hidden>
          <label class="check"><input type="checkbox" id="allowDeletes" /><span>同步删除操作</span></label>
          <div class="exec-summary" id="execSummary"></div>
          <button class="btn primary" id="applyBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>执行同步
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="remoteFilesTitle">
        <div class="card-head">
          <h2 id="remoteFilesTitle"><svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>远端文件</h2>
          <div class="head-actions">
            <a class="btn small" id="remoteZipBtn" href="#" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-zip" /></svg>打包下载全部
            </a>
            <button class="btn small" id="remoteFilesRefresh" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>刷新列表
            </button>
          </div>
        </div>
        <div class="card-body scroll" id="remoteFilesBody"></div>
      </section>

      <section class="card" aria-labelledby="historyTitle">
        <div class="card-head">
          <h2 id="historyTitle"><svg class="icon" aria-hidden="true"><use href="#i-history" /></svg>最近同步</h2>
        </div>
        <div class="card-body" id="historyBody"></div>
      </section>
    </div>
  </main>

  <section class="gate" id="remoteGate" hidden>
    <div class="gate-card">
      <svg class="gate-icon" aria-hidden="true"><use href="#i-globe" /></svg>
      <h2>这是本机控制台</h2>
      <p>本页面只能在本机（127.0.0.1）打开，因为它能修改本机文件夹。从局域网访问请使用零安装模式，只需要浏览器、不用装任何东西。</p>
      <a class="btn primary" href="/lite">进入零安装模式</a>
    </div>
  </section>

  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
